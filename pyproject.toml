[project]
name = "cpan123"
version = "0.2.13"
description = "123云盘的python接口文档(非官方)"
readme = "README.md"
authors = [
    { name = "zoushucai", email = "zoushucai@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.0",
    "python-dotenv>=0.9.9",
    "httpx[http2]>=0.28.1",
    "loguru>=0.7.3",
    "py3-wget>=1.0.13",
    "pydantic>=2.12.4",
    "ratelimit>=2.2.1",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
]

[project.scripts]
cpan123 = "cpan123.cli:cli"

[build-system]
requires = ["uv_build>=0.9.7,<0.12.0"]
build-backend = "uv_build"



[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"


[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "I",      # isort — 导入排序
    "B",      # flake8-bugbear — 检测常见 bug
    "UP",     # pyupgrade — 自动升级到 py310+ 语法
    "N",      # pep8-naming — 命名规范
    "E",      # pycodestyle 错误
    "W",      # pycodestyle 警告
    "SIM",    # flake8-simplify — 简化代码
    "ARG",    # flake8-unused-arguments — 未使用的参数
    "T10",    # flake8-debugger — 残留调试代码
    "PERF",   # perflint — 性能建议
    "RUF100", # 检测未使用的 noqa 注释
]
ignore = [
    "RUF001", # 中文文档字符串中的全角字符是正常用法
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# API 参数命名（如 parentFileID）与 123 云盘官方接口一致，跳过命名规范检查
"src/cpan123/*.py" = ["N803", "N806", "N815", "N999"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "jsonschema>=4.23.0",
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.1",
    "mkdocs-get-deps>=0.2.0",
    "mkdocs-material>=9.6.14",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocstrings>=0.29.1",
    "mkdocstrings-python>=1.16.10",
    "pytest>=8.3.5",
    "ruff>=0.11.8",
    "jsonpath>=0.80.0",
    "pandas>=2.3.0",
]

[[tool.uv.index]]
name = "Tsinghua"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

# 加上 PyPI 官方源，确保能拉取全部包版本
[[tool.uv.index]]
name = "PyPI"
url = "https://pypi.org/simple"

[project.urls]
Homepage = "https://github.com/zoushucai/cpan123"
Documentation = "https://cpan123.readthedocs.org"
Repository = "https://github.com/zoushucai/cpan123.git"
Issues = "https://github.com/zoushucai/cpan123/issues"
Changelog = "https://github.com/zoushucai/cpan123/blob/main/CHANGELOG.md"
